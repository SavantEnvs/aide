# aide.conf seed: options, macros, groups and rules
@@define DBDIR /var/lib/aide
@@define LOGDIR /var/log/aide
database_in=file:@@{DBDIR}/aide.db
database_out=file:@@{DBDIR}/aide.db.new
database_new=file:@@{DBDIR}/aide.db.new
gzip_dbout=yes
log_level=warning
report_level=changed_attributes
report_format=json
report_url=stdout
report_base16=true
report_ignore_added_attrs = b
report_ignore_removed_attrs = b
num_workers=2
config_version=1.0
@@if defined DBDIR
Checksums = sha256+sha512
@@else
Checksums = md5
@@endif
@@if not hostname nosuchhost
NORMAL = p+i+n+u+g+s+m+c+acl+xattrs+Checksums
@@endif
@@if 0.19.1 version_ge 0.18
CONTENT_EX = sha256+ftype+p+u+g+n+acl+xattrs
@@endif
@@undef LOGDIR
DIR = p+i+n+u+g+acl+xattrs
/etc$ DIR
/etc NORMAL
!/etc/mtab$
=/var/log$ DIR
-/var/log/.*\.gz$ f
/etc/hosts f CONTENT_EX
/usr/lib d,l CONTENT_EX-acl
/boot/ R
